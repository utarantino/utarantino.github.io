<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
          <p class="pronouns">{{ site.pronouns }}</p>

          {% if site.logo %}
            <img class="profile-photo"
                src="{{ site.logo | relative_url }}"
                alt="Portrait by Marta Meinardi">
          {% endif %}

          <p class="bio">{{ site.bio }}</p>     
                          
          <div class="contacts">

            <address class="contact-details">
              <h4><span class="email" aria-hidden="true"></span>e-mail</h4>
              <p>tarantino <i>at</i> irif <i>dot</i> fr</p>

              <h4><span class="address" aria-hidden="true"></span>address</h4>
              <p>{{ site.location }}</p>
            </address>

            <nav class="academic-profiles" aria-label="Academic profiles">
              <h4><span class="links" aria-hidden="true"></span>links</h4>

              <div class="academic-links">
                <a href="{{ '/cv/cv.pdf' | relative_url }}">CV</a>
                <a href="{{ site.arxiv }}">ArXiv</a>
                <a href="{{ site.hal }}">HAL</a>
                <a href="{{ site.researchgate }}">ResearchGate</a>
                <a href="{{ site.googlescholar }}">Google Scholar</a>
              </div>
            </nav>

          </div>        
      </header>

      <main id="main-content">
        {{ content }}
      </main>
    </div>

  <script>
    const sections = document.querySelectorAll('.home-section');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let animating = false;

    const timing = {
      duration: 100,
      easing: 'ease-out'
    };

    async function openSection(section) {
      const summary = section.querySelector(':scope > summary');
      const content = section.querySelector(':scope > .home-section-content');

      section.open = true;

      if (reducedMotion.matches) return;

      const collapsedHeight = summary.offsetHeight;
      const expandedHeight = section.offsetHeight;

      section.style.overflow = 'hidden';

      const heightAnimation = section.animate(
        [
          { height: `${collapsedHeight}px` },
          { height: `${expandedHeight}px` }
        ],
        timing
      );

      const contentAnimation = content.animate(
        [
          { opacity: 0.65, transform: 'translateY(-2px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        timing
      );

      await Promise.all([
        heightAnimation.finished,
        contentAnimation.finished
      ]).catch(() => {});

      section.style.overflow = '';
    }

    async function closeSection(section) {
      const summary = section.querySelector(':scope > summary');
      const content = section.querySelector(':scope > .home-section-content');

      if (reducedMotion.matches) {
        section.open = false;
        return;
      }

      const expandedHeight = section.offsetHeight;
      const collapsedHeight = summary.offsetHeight;

      section.style.overflow = 'hidden';

      const heightAnimation = section.animate(
        [
          { height: `${expandedHeight}px` },
          { height: `${collapsedHeight}px` }
        ],
        timing
      );

      const contentAnimation = content.animate(
        [
          { opacity: 1, transform: 'translateY(0)' },
          { opacity: 0.65, transform: 'translateY(-2px)' }
        ],
        timing
      );

      await Promise.all([
        heightAnimation.finished,
        contentAnimation.finished
      ]).catch(() => {});

      section.open = false;
      section.style.overflow = '';
    }

    sections.forEach(section => {
      const summary = section.querySelector(':scope > summary');

      summary.addEventListener('click', async event => {
        event.preventDefault();

        if (animating) return;
        animating = true;

        if (section.open) {
          await closeSection(section);
        } else {
          const current = document.querySelector('.home-section[open]');

          if (current && current !== section) {
            await closeSection(current);
          }

          await openSection(section);
        }

        animating = false;
      });
    });
  </script>
  </body>
</html>
